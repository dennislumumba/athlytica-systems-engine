<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NRHL × Athlytica — bundle preview</title>
<!--
  Review harness. Not for deployment — it exists so the widgets can be
  checked against the real brand tokens before anything touches the live
  index.html. Append ?api=http://localhost:3000/api/v1 to point the
  widgets at a local Athlytica HQ.
-->
<style>
  :root {
    --color-deep-navy: #051020;
    --color-deep-navy-2: #081a31;
    --color-navy-sheen: #0e2749;
    --color-gold: #D4AF37;
    --color-gold-soft: #F4E4B7;
    --color-text: #D9E5F2;
    --color-muted: #8CA0B8;
    --color-border: rgba(212, 175, 55, 0.16);
    --color-panel: rgba(255, 255, 255, 0.045);
    --shadow-xl: 0 28px 80px rgba(0, 0, 0, 0.38);
    --radius-lg: 28px;
    --radius-md: 20px;
    --max-width: 1240px;
    --transition-fast: 180ms ease;
  }
  body {
    margin: 0;
    background: var(--color-deep-navy);
    color: var(--color-text);
    font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    padding: 40px 24px 80px;
  }
  .harness { max-width: 1240px; margin: 0 auto; }
  .harness > h1 { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: var(--color-gold); }
  .metric { border: 1px solid var(--color-border); border-radius: 20px; padding: 16px 20px; display: inline-block; margin-bottom: 28px; }
  .metric-value { font-size: 30px; font-weight: 800; color: var(--color-gold-soft); display: block; }
  .metric-copy { margin: 4px 0 0; font-size: 13px; color: var(--color-muted); }
  hr { border: none; border-top: 1px solid var(--color-border); margin: 34px 0; }
</style>
<link rel="stylesheet" href="nrhl-athlytica.css">
</head>
<body>
  <div class="harness">
    <h1>NRHL × Athlytica — bundle preview</h1>

    <div class="metric">
      <strong class="metric-value" id="countdownDays">Open</strong>
      <p class="metric-copy" id="countdownLabel">Prospect ID Window is now active</p>
    </div>

    <div data-nrhl="pillars"></div>
    <hr>
    <div data-nrhl="timeline"></div>
    <hr>
    <div data-nrhl="packages"></div>
    <hr>
    <div data-nrhl="standings"></div>
    <hr>
    <div data-nrhl="leaderboard"></div>
    <hr>
    <div data-nrhl="verify"></div>
  </div>
  <script defer src="nrhl-athlytica.js"></script>
</body>
</html>
